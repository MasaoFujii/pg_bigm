name: test

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: regression test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        pgbranch:
          - master
          - REL_19_STABLE
          - REL_18_STABLE
          - REL_17_STABLE
          - REL_16_STABLE
          - REL_15_STABLE
          - REL_14_STABLE
          - REL_13_STABLE
          - REL_12_STABLE
          - REL_11_STABLE
          - REL_10_STABLE
          - REL9_6_STABLE
          - REL9_5_STABLE
          - REL9_4_STABLE
          - REL9_3_STABLE
          - REL9_2_STABLE
    env:
      PGBRANCH: ${{ matrix.pgbranch }}
    steps:
    - uses: actions/checkout@v5
    - name: apt
      run: |
        sudo apt-get --yes update
        sudo apt-get --yes install libreadline-dev
    - name: set_env
      run: |
        echo "PGHOME=${HOME}/${PGBRANCH}" >> $GITHUB_ENV
        echo "PGDATA=${HOME}/pgdata" >> $GITHUB_ENV
    - name: add_path
      run: |
        echo "${PGHOME}/bin" >> $GITHUB_PATH
    - name: Build and start PostgreSQL
      run: |
        git clone -b ${PGBRANCH} --depth 1 https://github.com/postgres/postgres.git
        cd postgres
        git log -1 --format='%H %s'
        ./configure --prefix=${PGHOME} --enable-debug --enable-cassert
        make -j 2 -s
        make -s install
        cd contrib/pg_trgm
        make -j 2 -s
        make -s install
        cd ../..
        initdb -D ${PGDATA} --locale=C --encoding=UTF8
        pg_ctl -D "${PGDATA}" -l "${GITHUB_WORKSPACE}/postgres.log" -w start
    - name: Build and install pg_bigm
      run: |
        cd ${GITHUB_WORKSPACE}
        make USE_PGXS=1 PG_CONFIG=${PGHOME}/bin/pg_config
        make USE_PGXS=1 PG_CONFIG=${PGHOME}/bin/pg_config install
    - name: Run regression tests
      timeout-minutes: 5
      run: |
        make USE_PGXS=1 PG_CONFIG=${PGHOME}/bin/pg_config installcheck
        make USE_PGXS=1 PG_CONFIG=${PGHOME}/bin/pg_config installcheck-trgm
    - name: Collect failure logs
      if: failure()
      run: |
        for logfile in postgres/config.log postgres.log regression.diffs regression.out; do
          if [ -f "${logfile}" ]; then
            echo "::group::${logfile}"
            cat "${logfile}"
            echo "::endgroup::"
          fi
        done
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: failure-logs-${{ matrix.pgbranch }}-${{ github.run_attempt }}
        path: |
          postgres/config.log
          postgres.log
          regression.diffs
          regression.out
          results/
        if-no-files-found: ignore
